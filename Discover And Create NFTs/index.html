<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/Css/reset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:wght@400;500;700;800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/Css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="header container">
    <a href="/" class="header-logo">
      <img src="/images/Wave-logo.svg" alt="LOGO" width="93" height="48" class="header-logo-img">
      <h1>DiveSea</h1>
    </a>
    <input id="burger-toggle"  style="color: #f9f9f9" type="checkbox">
    <label for="burger-toggle">
      <span></span>
    </label>
    <nav class="header-menu">
      <ul class="header-menu-list">
        <li class="header-menu-item">
          <a href="/" class="header-menu-link">Discover</a>
        </li>
        <li class="header-menu-item">
          <a href="/" class="header-menu-link">creators</a>
        </li>
        <li class="header-menu-item">
          <a href="/" class="header-menu-link">Sell</a>
        </li>
        <li class="header-menu-item">
          <a href="/" class="header-menu-link">stats</a>
        </li>
      </ul>
    </nav>
    <form class="search-header">
      <img src="/images/search.svg" class="img-search" alt="/">
      <input placeholder='Search Art Work / Creator' type="text">
    </form>
    <button class=" header-book-button button" type="button">Connect Wallet</button>
  </div>
  <main class="content container">
    <hr>
    <section class="hero">
      <div class="hero__content-over">
        <p class="hero__content-over-text"><span>OVER 1M CREATORS</span></p>
      </div>
      <div class="hero__content">
        <h1 class="hero__title">Discover And <br> Create NFTs</h1>
        <p class="hero__text">Discover, Create and Sell NFTs On Our NFT Marketplace <br>With Over Thousands Of NFTs And Get a <b style="font-weight: 600; color: #141416;">$20 bonus.</b></p>
        <div class="hero__btn">
          <button class="button hero__butoon-black">Explore More</button>
          <button class="button hero__butoon-white">create NFT</button>
        </div>
        <div class="trustpilot">
          <img style="margin-right: 16px;" src="/images/icon/star-green.svg" alt="/">
          <div class="star-gold">
            <img src="/images/icon/star-gold.svg" alt="">
            <img src="/images/icon/star-gold.svg" alt="">
            <img src="/images/icon/star-gold.svg" alt="">
            <img src="/images/icon/star-gold.svg" alt="">
            <img src="/images/icon/star-gold.svg" alt="">
          </div>
          <p>4900+
            
          </p>
        </div>
          <ul class="hero__features-list">
            <li class="hero__features-item">
              <div class="hero__features-title">430K+</div>
              <p>Art Works</p>
            </li>
            <li class="hero__features-item">
              <div class="hero__features-title">159K+</div>
              <p>Creators</p>
            </li>
            <li class="hero__features-item">
              <div class="hero__features-title">87K+</div>
              <p>Collections</p>
            </li>
          </ul>
      </div>
      <img src="/images/Hero-Header.png" alt="" class="hero__img">
      <img src="/images/HeroHeader-1246px.png" alt="" class="hero__img-1246px">
      <img src="/images/Hero-Header-846px.png" alt="" class="hero__img-846px">
    </section>
    <section class="slider">

    </section>

  </main>
</body>
</html>
